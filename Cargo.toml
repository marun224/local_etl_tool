[workspace]
resolver = "2"
members = [
    "crates/metadata",
    "crates/secrets",
    "crates/state",
    "crates/scheduler",
    "crates/console",
    "crates/mcp",
    "crates/assistant",
    "crates/runner",
    "crates/plugin-sdk",
    "crates/connectors",
    "crates/duckdb-engine",
    "crates/cli",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# Internal
etl-metadata = { path = "crates/metadata", version = "0.1.0" }
etl-secrets = { path = "crates/secrets", version = "0.1.0" }
etl-state = { path = "crates/state", version = "0.1.0" }
etl-scheduler = { path = "crates/scheduler", version = "0.1.0" }
etl-console = { path = "crates/console", version = "0.1.0" }
etl-mcp = { path = "crates/mcp", version = "0.1.0" }
etl-assistant = { path = "crates/assistant", version = "0.1.0" }
etl-runner = { path = "crates/runner", version = "0.1.0" }
etl-plugin-sdk = { path = "crates/plugin-sdk", version = "0.1.0" }
etl-connectors = { path = "crates/connectors", version = "0.1.0" }
etl-duckdb-engine = { path = "crates/duckdb-engine", version = "0.1.0" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
