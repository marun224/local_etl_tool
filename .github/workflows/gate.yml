# The standing gate, on both operating systems, plus the acceptance that makes
# Phase 9 mean something: an artifact that runs where nothing is installed.
#
# Why two operating systems. The project was built Windows-first and the plan
# names that as a risk -- path escaping, long paths and CRLF were expected to
# bite. Linux here is not for completeness; it is the half that has never been
# exercised, and it is where a cross-built artifact actually has to run.
#
# What this cannot do. Phase 9c's developer workflow is a Windows machine
# producing a Linux artifact through Docker, and GitHub's Windows runners do not
# run Linux containers -- so that exact path has no runner to run on. What CI
# checks instead is the *output*: a Linux artifact is built on Linux and proved
# to run in a bare container. The Windows job proves the same artifact story on
# Windows. The one thing left uncovered is the container hop itself, which is a
# developer convenience rather than a property of what ships.

name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A failing build should not also be a slow one.
  CARGO_INCREMENTAL: 0
  # The version scripts/fetch-duckdb.ps1 pins. Named here as well so the cache
  # key moves when it does; they must not disagree.
  DUCKDB_VERSION: v1.5.5
  # The extensions the gate's tests load. Part of the cache key, for the reason
  # given at the cache step. Hyphen-separated, because actions/cache refuses a
  # key with a comma in it; no DuckDB extension has a hyphen in its name.
  DUCKDB_TEST_EXTENSIONS: excel-delta-iceberg-httpfs-postgres-mysql

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both answers are wanted. A Windows failure must not hide the Linux
      # result, which is the newer and less-trodden of the two.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            etl: ./target/debug/etl.exe
            # Everything, desktop app included: this is where the GUI is
            # developed and where it has to keep working.
            scope: --workspace
          - os: ubuntu-latest
            etl: ./target/debug/etl
            # The headless product, which is what Linux is for. `apps/desktop`
            # is Tauri, and building it here would need WebKitGTK, GTK, glib and
            # pkg-config installed on every run -- an apt install of system
            # libraries to compile a window that nothing on a server opens. The
            # 10 desktop tests run on Windows; the CLI, runner, scheduler and
            # console -- the things that actually run on Linux -- run on both.
            scope: --workspace --exclude etl-desktop

    steps:
      - uses: actions/checkout@v4

      # Phase 10m: the Ubuntu runner's disk holds the Rust build and every test
      # server's image (kinesis-mock alone is 1.6 GB), and with MongoDB added it
      # ran out mid-compile ("No space left on device", run 35971619028). The
      # runner comes with toolchains this project never uses; removing them
      # frees about 20 GB. Windows runs no containers and has room.
      - name: Free disk space
        if: matrix.os == 'ubuntu-latest'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force > /dev/null
          df -h /

      # rust-toolchain.toml pins 1.96.0 with rustfmt and clippy, and rustup
      # honours it on the first cargo invocation. No toolchain action, because
      # the file is already the single source of truth and a second one would
      # be a second place to keep in step.
      - name: Show the toolchain
        run: rustup show && cargo --version && rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.os }}-

      # tools/ is git-ignored on purpose -- 284 MB of build inputs do not belong
      # in a repo -- so CI fetches it. Cached on the pinned version, because the
      # engine only moves when somebody decides it moves.
      # The key names the extension set as well as the version. The fetch step
      # below is skipped on a cache hit, so a key that ignored the list would
      # restore last week's engine without this week's extensions, and the
      # tests that need them would skip rather than fail: silently unverified.
      - name: Cache the vendored engine
        id: duckdb-cache
        uses: actions/cache@v4
        with:
          path: tools/duckdb
          key: duckdb-${{ matrix.os }}-${{ env.DUCKDB_VERSION }}-${{ env.DUCKDB_TEST_EXTENSIONS }}

      # Exactly the extensions some test loads, and no more. `excel` for the
      # Phase 4 round trip; since Phase 10c, `delta`, `iceberg` and `httpfs` for
      # the lake fixtures, and `postgres` and `mysql` for the servers below. If
      # another test ever needs another, it goes in DUCKDB_TEST_EXTENSIONS and the
      # test that skipped without it will say which one it wanted.
      - name: Fetch DuckDB and the extensions the tests load
        if: steps.duckdb-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/fetch-duckdb.ps1 -Version $env:DUCKDB_VERSION
          ./scripts/fetch-duckdb-extensions.ps1 -Version $env:DUCKDB_VERSION -Extensions $env:DUCKDB_TEST_EXTENSIONS.Split('-')

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy ${{ matrix.scope }} --all-targets -- -D warnings

      # Phase 10c: PostgreSQL, MySQL and MinIO in containers, for
      # tests/verified.rs; since 10e a Kafka broker, since 10g five NATS servers and
      # since 10h kinesis-mock, since 10j ElasticMQ (SQS), since 10k the Pub/Sub
      # emulator, since 10l RabbitMQ, since 10m MongoDB, since 10o a BigQuery
      # emulator and since 10q MariaDB, for the streaming, queue, database and warehouse connectors'
      # tests and samples. Linux only, because
      # Windows runners cannot run Linux containers; on Windows those tests
      # skip, and the lake ones still run.
      - name: Start the servers the verification tests use
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./scripts/test-services.ps1

      - name: Tests
        run: cargo test ${{ matrix.scope }}

      # `cargo test` builds the CLI only as a test harness under target/debug/deps
      # and never writes target/debug/etl. Every machine this was rehearsed on had
      # an earlier `cargo build` lying around, which is why the first CI run was
      # the first place that showed.
      - name: Build the CLI the next two steps run
        run: cargo build -p etl-cli

      # The gate passing and the product working are different claims. These are
      # the numbers the tracker records, checked rather than described.
      - name: The registry is all there
        shell: bash
        run: |
          count=$(${{ matrix.etl }} components | tail -1 | grep -oE '^[0-9]+')
          echo "components: $count"
          test "$count" = "78"

      - name: The samples still print what they printed
        shell: bash
        run: |
          set -e
          ${{ matrix.etl }} run samples/pipelines/orders_enriched.json
          ${{ matrix.etl }} run samples/pipelines/orders_checked.json
          ${{ matrix.etl }} run samples/pipelines/orders_guarded.json
          ${{ matrix.etl }} run samples/pipelines/orders_xml.json

  # Phase 9's "done": a self-contained artifact, built and then run somewhere it
  # has no right to work.
  artifact:
    name: artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            etl: ./target/debug/etl.exe
            # Windows will not execute a file with no extension, so the baked
            # artifact has to be named like one.
            baked: checked.exe
            baked_xml: xml.exe
            runner: ""
          - os: ubuntu-latest
            etl: ./target/debug/etl
            baked: checked
            baked_xml: xml
            # The runner that ships, not the one cargo just built. A runner
            # built on the ubuntu-24.04 host needs glibc 2.39 and will not start
            # on Debian 12 -- the second CI run found exactly that, which is the
            # Phase 9c lesson arriving by a different road. build-runner.ps1
            # builds in rust:1.96-slim-bookworm (glibc 2.36), and that floor is
            # what the bare-container step below exists to prove. It also keeps
            # the answer from moving when ubuntu-latest does.
            runner: --runner tools/runners/linux_amd64/etl-runner

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Cache the vendored engine
        id: duckdb-cache
        uses: actions/cache@v4
        with:
          path: tools/duckdb
          key: duckdb-${{ matrix.os }}-${{ env.DUCKDB_VERSION }}

      - name: Fetch DuckDB
        if: steps.duckdb-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-duckdb.ps1 -Version $env:DUCKDB_VERSION

      - name: Build etl and the runner
        run: cargo build -p etl-cli -p etl-runner

      - name: Build the runner that ships for Linux
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./scripts/build-runner.ps1 -Platform linux_amd64

      # Two pipelines: one DuckDB runs alone, and one with a component written
      # in Rust at each end (Phase 10a), whose connectors have to travel inside
      # the runner rather than beside it.
      - name: Bake a pipeline into an executable
        shell: bash
        run: |
          set -e
          ${{ matrix.etl }} build samples/pipelines/orders_checked.json --out ${{ matrix.baked }} ${{ matrix.runner }}
          ${{ matrix.etl }} build samples/pipelines/orders_xml.json --out ${{ matrix.baked_xml }} ${{ matrix.runner }}
          ls -l ${{ matrix.baked }} ${{ matrix.baked_xml }}

      # The property the ${workspace} fix bought, and the one that was broken
      # until Phase 9c ran a cross-built artifact: an artifact must not carry the
      # build machine's directory layout inside it.
      - name: It runs from somewhere else entirely
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cp ${{ matrix.baked }} ${{ matrix.baked_xml }} "$RUNNER_TEMP/elsewhere/"
          cd "$RUNNER_TEMP/elsewhere"
          ./${{ matrix.baked }} --workspace "$GITHUB_WORKSPACE" | tee out.txt
          grep -q "Ran 6 stage(s)" out.txt
          ./${{ matrix.baked_xml }} --workspace "$GITHUB_WORKSPACE" | tee xml.txt
          grep -q "7 record(s) written to" xml.txt
          test "$(grep -c '<order ' "$GITHUB_WORKSPACE/samples/out/orders_2026.xml")" = "7"

      # The air-gap claim, and the only test that actually makes it. A base image
      # with no Rust, no DuckDB and -- with --network none -- nothing to reach
      # for. Linux only: Windows runners cannot run Linux containers, and a
      # Windows container image with nothing in it is not a thing.
      - name: It runs in a bare container with no network
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          docker run --rm --network none \
            -v "$PWD:/w" -w /w \
            debian:12-slim ./${{ matrix.baked }} | tee container.txt
          grep -q "Ran 6 stage(s)" container.txt
          docker run --rm --network none \
            -v "$PWD:/w" -w /w \
            debian:12-slim ./${{ matrix.baked_xml }} | tee container-xml.txt
          grep -q "7 record(s) written to" container-xml.txt

  # `scripts/build-runner.ps1` is the only part of the cross-build story that
  # nothing else covers, and both of its failure modes -- the wrong base image,
  # and a build tree left by a different one -- were found by hand rather than
  # by a test. Running it here is redundant work (a Linux binary, built in a
  # Linux container, on a Linux host) and that is fine: what is being checked is
  # the script, not the binary.
  cross-build-script:
    name: build-runner.ps1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build a runner through the script
        shell: pwsh
        run: ./scripts/build-runner.ps1 -Platform linux_amd64

      - name: It produced a Linux executable
        run: |
          set -e
          file tools/runners/linux_amd64/etl-runner
          file tools/runners/linux_amd64/etl-runner | grep -q 'ELF 64-bit'
          test -x tools/runners/linux_amd64/etl-runner

      # The runner with nothing baked into it is a state, not a failure, and it
      # says so. Exit 1 and that sentence are the contract.
      - name: An unbaked runner says it has no pipeline
        run: |
          set +e
          out=$(./tools/runners/linux_amd64/etl-runner 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" = "1"
          echo "$out" | grep -q "no pipeline is baked into this runner"

      # Rerunning must be cheap and must not rebuild. This is the guard on the
      # image-keyed target directory: a second run that rebuilt would mean the
      # cache key is wrong.
      - name: Running it again is a no-op
        shell: pwsh
        # 6>&1 because the script reports with Write-Host, which is the
        # information stream, and a plain pipe captures none of it -- the first
        # CI run skipped correctly and then failed for not having heard it say so.
        run: |
          $out = ./scripts/build-runner.ps1 -Platform linux_amd64 6>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'already present') { throw 'expected the second run to skip' }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
